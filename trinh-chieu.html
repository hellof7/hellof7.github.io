<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Chiếu Kỷ Niệm - F7 Team</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap');
        
        :root {
            --primary-pink: #ff9cbd;
            --soft-pink: #ffb6c1;
            --bg-color: #fff5f8;
            --text-color: #6b5252;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#ffe0e9 3px, transparent 3px);
            background-size: 30px 30px;
            color: var(--text-color);
            display: flex; flex-direction: column; min-height: 100vh;
        }

        /* --- HEADER Y HỆT --- */
        header { background-color: var(--primary-pink); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(255, 156, 189, 0.4); border-bottom: 4px solid #ff7da5; z-index:100; }
        .logo { font-size: 28px; font-weight: 900; color: var(--white); text-shadow: 2px 3px 0px #e07096; text-decoration: none; }
        nav { display: flex; gap: 15px; }
        nav a { text-decoration: none; color: var(--white); font-weight: 700; font-size: 17px; padding: 10px 20px; border-radius: 30px; transition: 0.3s; }
        nav a:hover, nav a.active { background-color: var(--white); color: var(--primary-pink); transform: translateY(-3px); }

        main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }

        .slideshow-header { text-align: center; margin-bottom: 20px; }
        .slideshow-header h1 { color: #ff6b9e; font-size: 32px; font-weight: 900; margin-bottom: 5px; }
        .btn-back { display: inline-block; text-decoration: none; background-color: var(--soft-pink); color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; margin-bottom: 20px; transition: 0.3s;}
        .btn-back:hover { background-color: var(--primary-pink); }

        /* --- KHU VỰC TRÌNH CHIẾU --- */
        .slider-container {
            position: relative; width: 100%; max-width: 900px; height: 60vh; min-height: 400px;
            background-color: #222; border-radius: 30px; border: 6px solid var(--soft-pink);
            box-shadow: 0 15px 30px rgba(255,156,189,0.4); display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        .slide-item { width: 100%; height: 100%; display: none; justify-content: center; align-items: center; position: relative;}
        .slide-item.active { display: flex; animation: fade 0.5s ease-in-out; }
        @keyframes fade { from {opacity: .4} to {opacity: 1} }

        .slide-item img, .slide-item video {
            max-width: 100%; max-height: 100%; object-fit: contain;
        }

        /* Caption phủ lên ảnh */
        .slide-caption {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 182, 193, 0.85); color: #444; padding: 15px 30px;
            border-radius: 20px; font-size: 18px; font-weight: 700; text-align: center;
            max-width: 80%; backdrop-filter: blur(5px); border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Nút chuyển trang */
        .prev, .next {
            cursor: pointer; position: absolute; top: 50%; transform: translateY(-50%);
            width: auto; padding: 15px 20px; color: var(--primary-pink); background: rgba(255,255,255,0.8);
            font-weight: 900; font-size: 24px; border-radius: 50%; transition: 0.3s;
            user-select: none; border: 3px solid var(--soft-pink);
        }
        .prev { left: 20px; }
        .next { right: 20px; }
        .prev:hover, .next:hover { background-color: var(--primary-pink); color: white; }

        .no-media { color: white; font-size: 20px; font-weight: bold; text-align: center;}

        footer { text-align: center; padding: 25px; background-color: var(--primary-pink); color: var(--white); font-weight: 700; border-top: 4px solid #ff7da5; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">🍀 F7 Team 🍀</a>
        <nav id="navbar">
            <a href="goc-ky-niem.html" class="btn-back">⬅️ Quay lại</a>
        </nav>
    </header>

    <main>
        <div class="slideshow-header">
            <h1 id="albumNameDisplay">Đang tải Album...</h1>
            <p>Trải nghiệm lại từng khoảnh khắc thanh xuân</p>
        </div>

        <div class="slider-container" id="sliderContainer">
            <!-- Render từ JS -->
        </div>
    </main>

    <footer>
        <p>Made with ❤️ by F7 | Đồng hành từ 2025</p>
    </footer>

    <script>
        // Lấy ID album từ URL: ?id=abc123xyz
        const urlParams = new URLSearchParams(window.location.search);
        const currentAlbumId = urlParams.get('id');

        let albums = JSON.parse(localStorage.getItem('f7_albums')) || [];
        let mediaItems = JSON.parse(localStorage.getItem('f7_media')) || [];
        
        let targetAlbum = albums.find(a => a.id === currentAlbumId);
        let slides = mediaItems.filter(m => m.albumId === currentAlbumId);
        let slideIndex = 0;

        function initSlideshow() {
            if(!targetAlbum) {
                document.getElementById('albumNameDisplay').innerText = "Album không tồn tại!";
                document.getElementById('sliderContainer').innerHTML = "<div class='no-media'>Xin lỗi, có vẻ album này đã bị xóa 🥲</div>";
                return;
            }

            document.getElementById('albumNameDisplay').innerText = `🎬 ${targetAlbum.name}`;

            if(slides.length === 0) {
                document.getElementById('sliderContainer').innerHTML = "<div class='no-media'>Album này chưa có bức ảnh nào cả! 🥲</div>";
                return;
            }

            // Tạo các phần tử HTML cho từng slide
            let container = document.getElementById('sliderContainer');
            let htmlStr = "";
            slides.forEach((slide, index) => {
                let contentTag = slide.type === 'video' 
                    ? `<video src="${slide.src}" controls></video>` 
                    : `<img src="${slide.src}">`;
                
                let captionHtml = slide.caption ? `<div class="slide-caption">${slide.caption}</div>` : "";

                htmlStr += `
                    <div class="slide-item ${index === 0 ? 'active' : ''}">
                        ${contentTag}
                        ${captionHtml}
                    </div>
                `;
            });
            
            htmlStr += `
                <a class="prev" onclick="changeSlide(-1)">❮</a>
                <a class="next" onclick="changeSlide(1)">❯</a>
            `;
            container.innerHTML = htmlStr;
        }

        window.changeSlide = function(n) {
            let items = document.querySelectorAll('.slide-item');
            items[slideIndex].classList.remove('active');
            
            // Tạm dừng video nếu có
            let currentVid = items[slideIndex].querySelector('video');
            if(currentVid) currentVid.pause();

            slideIndex += n;
            if(slideIndex >= slides.length) slideIndex = 0;
            if(slideIndex < 0) slideIndex = slides.length - 1;

            items[slideIndex].classList.add('active');
        }

        initSlideshow();

        // Thêm tính năng dùng phím mũi tên Trái/Phải để chuyển ảnh
        document.addEventListener('keydown', function(event) {
            if(slides.length > 0) {
                if(event.key === 'ArrowLeft') changeSlide(-1);
                else if(event.key === 'ArrowRight') changeSlide(1);
            }
        });
    </script>
</body>
</html>
