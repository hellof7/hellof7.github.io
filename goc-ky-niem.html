<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Kỷ Niệm - F7 Team</title>
    <style>
        /* --- ĐỒNG BỘ GIAO DIỆN CHIIKAWA --- */
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap');
        
        :root {
            --primary-pink: #ff9cbd;
            --soft-pink: #ffb6c1;
            --bg-color: #fff5f8;
            --text-color: #6b5252;
            --white: #ffffff;
            --blue-pastel: #a0d8ef;
            --purple-pastel: #b19cd9;
            --yellow-pastel: #fdfd96;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#ffe0e9 3px, transparent 3px);
            background-size: 30px 30px;
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* --- HEADER & NAVBAR --- */
        header {
            background-color: var(--primary-pink);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(255, 156, 189, 0.4);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 4px solid #ff7da5;
        }

        .logo {
            font-size: 28px; font-weight: 900; color: var(--white);
            text-shadow: 2px 3px 0px #e07096; text-decoration: none;
        }

        nav { display: flex; gap: 15px; }
        nav a {
            text-decoration: none; color: var(--white); font-weight: 700; font-size: 17px;
            padding: 10px 20px; border-radius: 30px; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        nav a:hover, nav a.active {
            background-color: var(--white); color: var(--primary-pink); transform: translateY(-3px); box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }

        .hamburger { display: none; flex-direction: column; gap: 6px; cursor: pointer; }
        .hamburger span { width: 30px; height: 4px; background-color: var(--white); border-radius: 10px; transition: 0.3s; }

        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            .hamburger { display: flex; }
            nav {
                position: absolute; top: 100%; left: 0; width: 100%;
                background-color: var(--primary-pink); flex-direction: column; gap: 0; max-height: 0;
                overflow: hidden; transition: max-height 0.4s ease-in-out; border-bottom: 0px solid #ff7da5;
            }
            nav.active { max-height: 300px; border-bottom: 4px solid #ff7da5; box-shadow: 0 10px 10px rgba(0,0,0,0.1); }
            nav a { border-radius: 0; padding: 15px 20px; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.2); }
        }

        main { max-width: 1100px; margin: 30px auto; padding: 20px; }

        /* --- CONTROL PANEL TẢI MEDIA VÀ TẠO ALBUM --- */
        .panel {
            background: rgba(255,255,255,0.9); padding: 30px; border-radius: 30px;
            box-shadow: 0 8px 20px rgba(255,182,193,0.2); margin-bottom: 40px;
            border: 4px dashed var(--soft-pink); backdrop-filter: blur(5px);
        }
        .panel h3 { margin-top: 0; color: #ff6b9e; font-size: 24px; font-weight: 900; margin-bottom: 20px; }
        .form-row { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 15px; }
        .form-group { flex: 1; min-width: 220px; }
        label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 15px; color: #e07096; }
        
        input, select, textarea {
            width: 100%; padding: 12px 15px; border: 2px solid #ffe0e9; border-radius: 15px;
            font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 15px;
            color: var(--text-color); transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-pink); box-shadow: 0 0 10px rgba(255,156,189,0.3); }

        .btn {
            background-color: var(--primary-pink); color: white; border: none; padding: 12px 25px;
            border-radius: 25px; font-weight: 900; font-size: 15px; cursor: pointer; transition: 0.3s;
            font-family: 'Quicksand', sans-serif; box-shadow: 0 5px 10px rgba(255,156,189,0.4); display: inline-flex; align-items: center; gap: 5px;
        }
        .btn:hover { background-color: #ff7da5; transform: translateY(-3px); }
        .btn-secondary { background-color: var(--blue-pastel); color: #444; box-shadow: 0 5px 10px rgba(160,216,239,0.4); }
        .btn-secondary:hover { background-color: #79c9ef; }
        .btn-danger { background-color: #ffcccb; color: #d32f2f; box-shadow: none; }
        .btn-danger:hover { background-color: #ff4c4c; color: white; }
        .btn-action { padding: 8px 15px; border-radius: 15px; font-size: 13px; margin-left: 5px;}

        /* --- GALLERY TỪNG ALBUM --- */
        .album-section { margin-bottom: 50px; background: #fff; padding: 25px; border-radius: 30px; box-shadow: 0 10px 20px rgba(255,182,193,0.15); border: 3px solid #fff0f5; }
        .album-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border-bottom: 3px dashed #ffb6c1; padding-bottom: 15px; margin-bottom: 20px; gap: 10px;}
        .album-title-group { display: flex; align-items: center; gap: 15px; flex-wrap: wrap;}
        .album-title { font-size: 26px; font-weight: 900; color: #ff6b9e; margin: 0; }
        .album-badge { background-color: var(--purple-pastel); color: #fff; padding: 5px 15px; border-radius: 20px; font-size: 14px; font-weight: 800; box-shadow: 0 3px 5px rgba(0,0,0,0.1); }
        
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .media-card { background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 15px rgba(255,182,193,0.2); display: flex; flex-direction: column; border: 2px solid #fff0f5; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .media-card:hover { transform: translateY(-10px) scale(1.02); border-color: var(--soft-pink); z-index: 10; }
        
        .media-container { width: 100%; height: 200px; background: #fdf0f5; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden;}
        .media-container img, .media-container video { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        
        .media-body { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .media-caption { font-size: 15px; font-weight: 600; color: var(--text-color); margin-bottom: 10px; white-space: pre-wrap; word-break: break-word; }
        
        .media-actions { display: flex; gap: 5px; justify-content: flex-end; align-items: center; margin-top: auto; }
        .media-actions button { padding: 8px 12px; border-radius: 12px; border: none; font-size: 12px; font-weight: 800; cursor: pointer; font-family: 'Quicksand', sans-serif; transition: 0.2s;}

        /* --- MODAL CHUNG --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 182, 193, 0.4); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: #fff; padding: 30px; border-radius: 30px; width: 90%; max-width: 500px; box-shadow: 0 15px 30px rgba(255,156,189,0.3); border: 4px solid #fff0f5; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-content h3 { color: #ff6b9e; font-size: 24px; margin-bottom: 15px; font-weight: 900; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        footer { text-align: center; padding: 25px; background-color: var(--primary-pink); color: var(--white); font-weight: 700; border-top: 4px solid #ff7da5; margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">🍀 F7 Team 🍀</a>
        <div class="hamburger" id="mobile-menu"><span></span><span></span><span></span></div>
        <nav id="navbar">
            <a href="index.html">Trang Chủ</a>
            <a href="goc-ky-niem.html" class="active">Góc Kỷ Niệm</a>
            <a href="su-kien-hang-nam.html">Sự Kiện Hằng Năm</a>
        </nav>
    </header>

    <main>
        <!-- KHU VỰC THÊM ALBUM VÀ TẢI LÊN KỶ NIỆM -->
        <div class="panel">
            <h3>📸 Đăng Kỷ Niệm Mới</h3>
            <form id="mediaForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Chọn Album lưu trữ *</label>
                        <select id="albumSelect" required>
                            <!-- Render bằng JS -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Hoặc Tạo Album mới</label>
                        <button type="button" class="btn btn-secondary" style="width:100%; justify-content:center;" onclick="openAlbumModal()">✨ Tạo Album Mới</button>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Tải lên từ máy (Chọn nhiều Ảnh / Video cùng lúc)</label>
                        <!-- ĐÃ THÊM THUỘC TÍNH MULTIPLE -->
                        <input type="file" id="fileInput" accept="image/*,video/*" multiple>
                    </div>
                    <div class="form-group">
                        <label>Hoặc dán Link (URL ảnh/video)</label>
                        <input type="url" id="mediaUrl" placeholder="https://...">
                    </div>
                </div>

                <button type="submit" class="btn" id="submitBtn">🚀 Đăng Lên Góc Kỷ Niệm</button>
            </form>
        </div>

        <!-- KHU VỰC HIỂN THỊ CÁC ALBUM VÀ MEDIA -->
        <div id="albumsContainer">
            <!-- Render từ JS -->
        </div>
    </main>

    <!-- MODAL TẠO / SỬA ALBUM -->
    <div class="modal-overlay" id="albumModal">
        <div class="modal-content">
            <h3 id="albumModalTitle">✨ Tạo Album Mới</h3>
            <input type="hidden" id="modalAlbumId">
            <div style="margin-bottom: 15px;">
                <label>Tên Album</label>
                <input type="text" id="modalAlbumName" placeholder="VD: Sinh Nhật Chị Đại...">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Phân loại (Classify)</label>
                <select id="modalAlbumCat">
                    <option value="Sự Kiện 🎉">Sự Kiện 🎉</option>
                    <option value="Du Lịch 🚗">Du Lịch 🚗</option>
                    <option value="Thanh Xuân 🌸">Thanh Xuân 🌸</option>
                    <option value="Lầy Lội 🤪">Lầy Lội 🤪</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-danger btn-action" onclick="closeAlbumModal()">Hủy</button>
                <button class="btn" onclick="saveAlbum()">Lưu Album</button>
            </div>
        </div>
    </div>

    <!-- MODAL VIẾT/SỬA CAPTION -->
    <div class="modal-overlay" id="captionModal">
        <div class="modal-content">
            <h3>✍️ Viết Caption</h3>
            <input type="hidden" id="modalMediaId">
            <textarea id="modalCaptionText" rows="4" placeholder="Nhập cảm xúc của bạn..."></textarea>
            <div class="modal-buttons">
                <button class="btn btn-danger btn-action" onclick="closeCaptionModal()">Hủy</button>
                <button class="btn" onclick="saveCaption()">Lưu</button>
            </div>
        </div>
    </div>

    <footer>
        <p>Made with ❤️ by F7 | Đồng hành từ 2025</p>
    </footer>

    <script>
        // --- NAVBAR MOBILE ---
        document.getElementById('mobile-menu').addEventListener('click', () => {
            document.getElementById('navbar').classList.toggle('active');
        });

        // --- DỮ LIỆU ---
        let albums = JSON.parse(localStorage.getItem('f7_albums')) || [];
        let mediaItems = JSON.parse(localStorage.getItem('f7_media')) || [];

        function normalizeData() {
            let changed = false;
            albums = albums.map(a => {
                if (typeof a === 'string') {
                    changed = true;
                    return { id: 'alb_' + Math.random().toString(36).substr(2, 9), name: a, category: 'Thanh Xuân 🌸' };
                }
                if(!a.category) { a.category = 'Thanh Xuân 🌸'; changed = true;}
                return a;
            });
            mediaItems = mediaItems.map(m => {
                if(!m.albumId && m.album) {
                    let match = albums.find(a => a.name === m.album);
                    if(match) m.albumId = match.id;
                    changed = true;
                }
                return m;
            });
            if(changed) saveData();
        }

        function saveData() {
            localStorage.setItem('f7_albums', JSON.stringify(albums));
            localStorage.setItem('f7_media', JSON.stringify(mediaItems));
        }

        // --- QUẢN LÝ ALBUM ---
        function renderAlbumsDropdown() {
            const select = document.getElementById('albumSelect');
            select.innerHTML = albums.length ? '' : '<option value="">-- Chưa có Album nào --</option>';
            albums.forEach(alb => {
                select.innerHTML += `<option value="${alb.id}">${alb.name} (${alb.category})</option>`;
            });
        }

        function openAlbumModal(id = null) {
            document.getElementById('albumModal').style.display = 'flex';
            if(id) {
                let alb = albums.find(a => a.id === id);
                document.getElementById('albumModalTitle').innerText = '✏️ Sửa Album';
                document.getElementById('modalAlbumId').value = alb.id;
                document.getElementById('modalAlbumName').value = alb.name;
                document.getElementById('modalAlbumCat').value = alb.category;
            } else {
                document.getElementById('albumModalTitle').innerText = '✨ Tạo Album Mới';
                document.getElementById('modalAlbumId').value = '';
                document.getElementById('modalAlbumName').value = '';
                document.getElementById('modalAlbumCat').value = 'Thanh Xuân 🌸';
            }
        }

        function closeAlbumModal() { document.getElementById('albumModal').style.display = 'none'; }

        function saveAlbum() {
            const id = document.getElementById('modalAlbumId').value;
            const name = document.getElementById('modalAlbumName').value.trim();
            const cat = document.getElementById('modalAlbumCat').value;

            if(!name) return alert("Vui lòng nhập tên Album!");

            if(id) {
                let alb = albums.find(a => a.id === id);
                alb.name = name; alb.category = cat;
            } else {
                albums.unshift({ id: 'alb_' + Math.random().toString(36).substr(2, 9), name, category: cat });
            }
            saveData();
            closeAlbumModal();
            renderAlbumsDropdown();
            renderGallery();
        }

        function deleteAlbum(id, name) {
            if(confirm(`Bạn có chắc muốn xóa album "${name}" và toàn bộ kỷ niệm bên trong không?`)) {
                albums = albums.filter(a => a.id !== id);
                mediaItems = mediaItems.filter(m => m.albumId !== id);
                saveData();
                renderAlbumsDropdown();
                renderGallery();
            }
        }

        function playSlideshow(albumId) {
            window.location.href = `trinh-chieu.html?id=${albumId}`;
        }

        // --- XỬ LÝ ĐĂNG NHIỀU FILE CÙNG LÚC (MULTI-UPLOAD) ---
        document.getElementById('mediaForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const albumId = document.getElementById('albumSelect').value;
            if(!albumId) return alert("Vui lòng tạo Album trước khi đăng!");

            const fileInput = document.getElementById('fileInput');
            const urlInput = document.getElementById('mediaUrl').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            // Xử lý upload danh sách File từ máy
            if(fileInput.files && fileInput.files.length > 0) {
                submitBtn.disabled = true;
                submitBtn.innerText = "⏳ Đang xử lý tải lên...";

                const files = Array.from(fileInput.files);
                
                // Đọc toàn bộ danh sách file dưới dạng Promise
                const readFilesPromises = files.map(file => {
                    return new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const type = file.type.startsWith('video') ? 'video' : 'image';
                            resolve({
                                id: 'med_' + Math.random().toString(36).substr(2, 9),
                                albumId: albumId,
                                src: e.target.result,
                                type: type,
                                caption: ""
                            });
                        };
                        reader.readAsDataURL(file);
                    });
                });

                // Đợi đọc xong tất cả file rồi lưu vào mediaItems
                const newItems = await Promise.all(readFilesPromises);
                mediaItems.unshift(...newItems); // Thêm tất cả vào đầu mảng

                saveData();
                renderGallery();
                document.getElementById('mediaForm').reset();
                submitBtn.disabled = false;
                submitBtn.innerText = "🚀 Đăng Lên Góc Kỷ Niệm";

            } else if(urlInput) {
                // Xử lý link URL
                let type = (urlInput.match(/\.(mp4|webm|ogg)$/i) || urlInput.includes('video')) ? 'video' : 'image';
                mediaItems.unshift({
                    id: 'med_' + Math.random().toString(36).substr(2, 9),
                    albumId: albumId,
                    src: urlInput,
                    type: type,
                    caption: ""
                });
                saveData();
                renderGallery();
                document.getElementById('mediaForm').reset();
            } else {
                alert("Vui lòng chọn ít nhất 1 ảnh/video hoặc dán đường dẫn hợp lệ!");
            }
        });

        window.deleteMedia = function(id) {
            if(confirm("Xóa kỷ niệm này?")) {
                mediaItems = mediaItems.filter(m => m.id !== id);
                saveData(); renderGallery();
            }
        }

        // --- MODAL CAPTION ---
        window.openCaptionModal = function(id) {
            const item = mediaItems.find(m => m.id === id);
            document.getElementById('modalMediaId').value = id;
            document.getElementById('modalCaptionText').value = item.caption || "";
            document.getElementById('captionModal').style.display = 'flex';
        }
        function closeCaptionModal() { document.getElementById('captionModal').style.display = 'none'; }
        function saveCaption() {
            const id = document.getElementById('modalMediaId').value;
            const item = mediaItems.find(m => m.id === id);
            if(item) {
                item.caption = document.getElementById('modalCaptionText').value;
                saveData(); renderGallery();
            }
            closeCaptionModal();
        }

        // --- RENDER GIAO DIỆN CHÍNH ---
        function renderGallery() {
            const container = document.getElementById('albumsContainer');
            container.innerHTML = '';

            if(albums.length === 0) {
                container.innerHTML = `<p style="text-align:center; font-weight:700; color:#ff6b9e;">Chưa có album nào cả. Cùng tạo album đầu tiên nhé! 🍀</p>`;
                return;
            }

            albums.forEach(alb => {
                let itemsInAlbum = mediaItems.filter(m => m.albumId === alb.id);
                let mediaHtml = '';
                
                if(itemsInAlbum.length === 0) {
                    mediaHtml = `<p style="color: #999; grid-column: 1/-1; text-align: center; font-weight:bold;">Trống trơn... Hãy thêm ảnh vào album này nhé!</p>`;
                } else {
                    itemsInAlbum.forEach(item => {
                        let contentTag = item.type === 'video' 
                            ? `<video src="${item.src}" controls></video>` 
                            : `<img src="${item.src}" alt="Kỷ niệm">`;

                        mediaHtml += `
                            <div class="media-card">
                                <div class="media-container">${contentTag}</div>
                                <div class="media-body">
                                    <div class="media-caption">${item.caption ? item.caption : '<span style="color:#ccc; font-style:italic;">Chưa có caption...</span>'}</div>
                                    <div class="media-actions">
                                        <button class="btn btn-action" style="background-color:#ffe4e1; color:#ff6b9e;" onclick="openCaptionModal('${item.id}')">✍️ Sửa</button>
                                        <button class="btn-danger btn-action" onclick="deleteMedia('${item.id}')">❌ Xóa</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }

                container.innerHTML += `
                    <div class="album-section">
                        <div class="album-header">
                            <div class="album-title-group">
                                <h2 class="album-title">📂 ${alb.name}</h2>
                                <span class="album-badge">${alb.category || 'Khác ✨'}</span>
                            </div>
                            <div class="album-actions" style="display:flex; gap:10px;">
                                <button class="btn" onclick="playSlideshow('${alb.id}')">🎬 Xem Trình Chiếu</button>
                                <button class="btn btn-secondary btn-action" onclick="openAlbumModal('${alb.id}')">✏️ Sửa</button>
                                <button class="btn-danger btn-action" onclick="deleteAlbum('${alb.id}', '${alb.name}')">❌ Xóa</button>
                            </div>
                        </div>
                        <div class="media-grid">
                            ${mediaHtml}
                        </div>
                    </div>
                `;
            });
        }

        // Khởi chạy
        normalizeData();
        renderAlbumsDropdown();
        renderGallery();
    </script>
</body>
</html>
