<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Kỷ Niệm - F7 Team</title>
    <style>
        /* --- ĐỒNG BỘ GIAO DIỆN CHIIKAWA --- */
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap');
        
        :root {
            --primary-pink: #ff9cbd;
            --soft-pink: #ffb6c1;
            --bg-color: #fff5f8;
            --text-color: #6b5252;
            --white: #ffffff;
            --blue-pastel: #a0d8ef;
            --purple-pastel: #b19cd9;
            --yellow-pastel: #fdfd96;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#ffe0e9 3px, transparent 3px);
            background-size: 30px 30px;
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* --- HEADER & NAVBAR --- */
        header { background-color: var(--primary-pink); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(255, 156, 189, 0.4); position: sticky; top: 0; z-index: 1000; border-bottom: 4px solid #ff7da5; }
        .logo { font-size: 28px; font-weight: 900; color: var(--white); text-shadow: 2px 3px 0px #e07096; text-decoration: none; }
        nav { display: flex; gap: 15px; }
        nav a { text-decoration: none; color: var(--white); font-weight: 700; font-size: 17px; padding: 10px 20px; border-radius: 30px; transition: 0.3s; }
        nav a:hover, nav a.active { background-color: var(--white); color: var(--primary-pink); transform: translateY(-3px); box-shadow: 0 5px 10px rgba(0,0,0,0.1); }
        
        .hamburger { display: none; flex-direction: column; gap: 6px; cursor: pointer; }
        .hamburger span { width: 30px; height: 4px; background-color: var(--white); border-radius: 10px; transition: 0.3s; }

        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            .hamburger { display: flex; }
            nav { position: absolute; top: 100%; left: 0; width: 100%; background-color: var(--primary-pink); flex-direction: column; gap: 0; max-height: 0; overflow: hidden; transition: max-height 0.4s ease-in-out; border-bottom: 0px solid #ff7da5; }
            nav.active { max-height: 300px; border-bottom: 4px solid #ff7da5; box-shadow: 0 10px 10px rgba(0,0,0,0.1); }
            nav a { border-radius: 0; padding: 15px 20px; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.2); }
        }

        main { max-width: 1200px; margin: 30px auto; padding: 20px; }

        /* --- THANH CÔNG CỤ (FILTER & TẠO ALBUM) --- */
        .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 30px; background: rgba(255,255,255,0.9); padding: 20px; border-radius: 25px; box-shadow: 0 8px 20px rgba(255,182,193,0.2); border: 3px dashed var(--soft-pink); backdrop-filter: blur(5px); }
        .year-filter { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 900; color: #ff6b9e; }
        .year-filter select { padding: 8px 15px; border-radius: 15px; border: 2px solid var(--primary-pink); font-family: 'Quicksand', sans-serif; font-weight: 700; color: var(--text-color); font-size: 16px; outline: none; }
        
        .btn { background-color: var(--primary-pink); color: white; border: none; padding: 10px 20px; border-radius: 25px; font-weight: 900; font-size: 15px; cursor: pointer; transition: 0.3s; font-family: 'Quicksand', sans-serif; box-shadow: 0 5px 10px rgba(255,156,189,0.4); display: inline-flex; align-items: center; gap: 5px; }
        .btn:hover { background-color: #ff7da5; transform: translateY(-3px); }
        .btn-secondary { background-color: var(--blue-pastel); color: #444; box-shadow: 0 5px 10px rgba(160,216,239,0.4); }
        .btn-secondary:hover { background-color: #79c9ef; }
        .btn-danger { background-color: #ffcccb; color: #d32f2f; box-shadow: none; }
        .btn-danger:hover { background-color: #ff4c4c; color: white; }

        /* --- THUMBNAIL ALBUM GRID --- */
        .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        .album-thumb { background: #fff; border-radius: 25px; padding: 15px; cursor: pointer; border: 3px solid #fff0f5; box-shadow: 0 8px 15px rgba(255,182,193,0.2); transition: 0.3s; text-align: center; display: flex; flex-direction: column; }
        .album-thumb:hover { transform: translateY(-10px); border-color: var(--primary-pink); box-shadow: 0 12px 25px rgba(255,156,189,0.4); }
        
        .album-cover { width: 100%; height: 160px; border-radius: 15px; margin-bottom: 15px; background: #fdf0f5; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        .album-cover img, .album-cover video { width: 100%; height: 100%; object-fit: cover; }
        .album-cover .no-cover { font-size: 40px; opacity: 0.5; }
        .album-count { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; padding: 4px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; }

        .album-info h3 { color: #ff6b9e; font-size: 18px; font-weight: 900; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .album-badge { background-color: var(--purple-pastel); color: #fff; padding: 3px 10px; border-radius: 15px; font-size: 12px; font-weight: 800; display: inline-block; }

        /* --- MODAL CHUNG --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 182, 193, 0.6); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: #fff; padding: 30px; border-radius: 30px; width: 90%; max-width: 500px; box-shadow: 0 15px 30px rgba(255,156,189,0.4); border: 4px solid #fff0f5; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        input[type="text"], input[type="number"], input[type="url"], select, textarea { width: 100%; padding: 12px 15px; border: 2px solid #ffe0e9; border-radius: 15px; font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 15px; color: var(--text-color); transition: 0.3s; margin-top: 5px; box-sizing: border-box; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-pink); }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { font-weight: 700; color: #e07096; }

        /* --- MODAL CHI TIẾT ALBUM (POPUP LỚN ALL-IN-ONE) --- */
        .modal-content.large { width: 95%; max-width: 1100px; height: 90vh; display: flex; flex-direction: column; padding: 0; overflow: hidden; background: var(--bg-color); }
        .detail-header { background: #fff; padding: 20px 30px; border-bottom: 3px dashed var(--soft-pink); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .detail-title-group h2 { color: #ff6b9e; font-size: 26px; font-weight: 900; margin-bottom: 5px; }
        .detail-meta { font-size: 14px; font-weight: bold; color: #888; }
        .detail-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        
        .detail-body { flex: 1; overflow-y: auto; padding: 20px 30px; }
        
        /* Form upload trong Modal lớn */
        .upload-panel { background: #fff; padding: 20px; border-radius: 20px; border: 2px dashed var(--primary-pink); margin-bottom: 25px; display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        .upload-panel .form-group { margin-bottom: 0; flex: 1; min-width: 200px; }
        
        /* Grid Media trong Modal Lớn */
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .media-card { background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(255,182,193,0.3); display: flex; flex-direction: column; border: 2px solid #fff0f5; }
        .media-container { width: 100%; height: 160px; background: #fdf0f5; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .media-container img, .media-container video { width: 100%; height: 100%; object-fit: cover; }
        .media-body { padding: 10px; flex: 1; display: flex; flex-direction: column; }
        .media-caption { font-size: 13px; font-weight: 600; margin-bottom: 10px; word-break: break-word; }
        .media-actions { display: flex; gap: 5px; justify-content: flex-end; margin-top: auto; }
        .btn-small { padding: 5px 10px; font-size: 12px; border-radius: 10px; }

        footer { text-align: center; padding: 25px; background-color: var(--primary-pink); color: var(--white); font-weight: 700; border-top: 4px solid #ff7da5; margin-top: auto; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">🍀 F7 Team 🍀</a>
        <div class="hamburger" id="mobile-menu"><span></span><span></span><span></span></div>
        <nav id="navbar">
            <a href="index.html">Trang Chủ</a>
            <a href="goc-ky-niem.html" class="active">Góc Kỷ Niệm</a>
            <a href="su-kien-hang-nam.html">Sự Kiện Hằng Năm</a>
        </nav>
    </header>

    <main>
        <!-- TOOLBAR -->
        <div class="toolbar">
            <div class="year-filter">
                <label>📅 Lọc theo năm:</label>
                <select id="yearSelect" onchange="renderThumbnails()">
                    <!-- Render từ JS -->
                </select>
            </div>
            <button class="btn btn-secondary" onclick="openAlbumModal()">✨ Tạo Album Mới</button>
        </div>

        <!-- THUMBNAIL GRID -->
        <div id="albumGrid" class="album-grid">
            <!-- Render từ JS -->
        </div>
    </main>

    <!-- 1. MODAL TẠO / SỬA ALBUM (NHỎ) -->
    <div class="modal-overlay" id="albumModal" style="z-index: 3000;">
        <div class="modal-content">
            <h3 id="albumModalTitle">✨ Tạo Album Mới</h3>
            <input type="hidden" id="modalAlbumId">
            <div class="form-group">
                <label>Tên Album</label>
                <input type="text" id="modalAlbumName" placeholder="VD: Sinh Nhật Chị Đại...">
            </div>
            <div class="form-group">
                <label>Năm kỷ niệm</label>
                <input type="number" id="modalAlbumYear" min="2000" max="2100">
            </div>
            <div class="form-group">
                <label>Phân loại (Classify)</label>
                <select id="modalAlbumCat">
                    <option value="Sự Kiện 🎉">Sự Kiện 🎉</option>
                    <option value="Du Lịch 🚗">Du Lịch 🚗</option>
                    <option value="Thanh Xuân 🌸">Thanh Xuân 🌸</option>
                    <option value="Lầy Lội 🤪">Lầy Lội 🤪</option>
                    <!-- THÊM PHÂN LOẠI KHÁC -->
                    <option value="Khác ✨">Khác ✨</option>
                </select>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button class="btn btn-danger" onclick="closeAlbumModal()">Hủy</button>
                <button class="btn" onclick="saveAlbum()">Lưu Album</button>
            </div>
        </div>
    </div>

    <!-- 2. MODAL CHI TIẾT ALBUM (ALL-IN-ONE LỚN) -->
    <div class="modal-overlay" id="albumDetailModal">
        <div class="modal-content large">
            <div class="detail-header">
                <div class="detail-title-group">
                    <h2 id="detailTitle">Tên Album</h2>
                    <div class="detail-meta">
                        <span id="detailBadge" class="album-badge">Category</span>
                        <span id="detailYear" style="margin-left: 10px;">📅 2025</span>
                    </div>
                </div>
                <div class="detail-actions">
                    <button class="btn" id="btnPlaySlideshow">🎬 Trình Chiếu</button>
                    <button class="btn btn-secondary" onclick="editCurrentAlbum()">✏️ Sửa Album</button>
                    <button class="btn btn-danger" onclick="deleteCurrentAlbum()">❌ Xóa Album</button>
                    <button class="btn" style="background:#ccc; color:#333; box-shadow:none;" onclick="closeDetailModal()">✖ Đóng</button>
                </div>
            </div>
            
            <div class="detail-body">
                <!-- Vùng Tải lên siêu tốc cho Album này -->
                <form class="upload-panel" id="detailUploadForm">
                    <div class="form-group">
                        <label>Tải lên Ảnh/Video (Chọn nhiều)</label>
                        <input type="file" id="detailFileInput" accept="image/*,video/*" multiple>
                    </div>
                    <div class="form-group">
                        <label>Hoặc dán Link URL</label>
                        <input type="url" id="detailMediaUrl" placeholder="https://...">
                    </div>
                    <button type="submit" class="btn" id="btnUploadMedia">🚀 Đăng Lên</button>
                </form>

                <!-- Lưới hiển thị Media -->
                <div class="media-grid" id="detailMediaGrid">
                    <!-- Render từ JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- 3. MODAL VIẾT/SỬA CAPTION -->
    <div class="modal-overlay" id="captionModal" style="z-index: 3000;">
        <div class="modal-content">
            <h3>✍️ Viết Caption</h3>
            <input type="hidden" id="modalMediaId">
            <textarea id="modalCaptionText" rows="4" placeholder="Nhập cảm xúc của bạn..."></textarea>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button class="btn btn-danger" onclick="closeCaptionModal()">Hủy</button>
                <button class="btn" onclick="saveCaption()">Lưu</button>
            </div>
        </div>
    </div>

    <footer>
        <p>Made with ❤️ by F7 | Đồng hành từ 2025</p>
    </footer>

    <script>
        // --- NAVBAR MOBILE ---
        document.getElementById('mobile-menu').addEventListener('click', () => {
            document.getElementById('navbar').classList.toggle('active');
        });

        // --- DỮ LIỆU ---
        let albums = JSON.parse(localStorage.getItem('f7_albums')) || [];
        let mediaItems = JSON.parse(localStorage.getItem('f7_media')) || [];
        
        let currentViewAlbumId = null; // Lưu ID của album đang mở trong Popup Lớn

        // Chuẩn hóa dữ liệu cũ (Thêm trường Year nếu thiếu)
        function normalizeData() {
            let changed = false;
            let currentYear = new Date().getFullYear();
            albums = albums.map(a => {
                if (typeof a === 'string') { changed = true; return { id: 'alb_' + Math.random().toString(36).substr(2, 9), name: a, category: 'Thanh Xuân 🌸', year: currentYear }; }
                if (!a.category) { a.category = 'Thanh Xuân 🌸'; changed = true; }
                if (!a.year) { a.year = currentYear; changed = true; }
                return a;
            });
            mediaItems = mediaItems.map(m => {
                if (!m.albumId && m.album) {
                    let match = albums.find(a => a.name === m.album);
                    if(match) m.albumId = match.id;
                    changed = true;
                }
                return m;
            });
            if(changed) saveData();
        }

        function saveData() {
            localStorage.setItem('f7_albums', JSON.stringify(albums));
            localStorage.setItem('f7_media', JSON.stringify(mediaItems));
        }

        // --- RENDER BỘ LỌC NĂM ---
        function renderYearsDropdown() {
            const select = document.getElementById('yearSelect');
            let years = [...new Set(albums.map(a => a.year))];
            let currentYear = new Date().getFullYear();
            if(!years.includes(currentYear)) years.push(currentYear);
            years.sort((a, b) => b - a); // Năm mới nhất lên đầu

            let currentVal = select.value || currentYear.toString();
            select.innerHTML = '<option value="all">Tất cả các năm 🌟</option>';
            years.forEach(y => {
                select.innerHTML += `<option value="${y}">${y}</option>`;
            });
            
            // Set lại giá trị (nếu có)
            if (years.includes(parseInt(currentVal)) || currentVal === 'all') {
                select.value = currentVal;
            } else {
                select.value = years[0];
            }
        }

        // --- RENDER DANH SÁCH ALBUM (THUMBNAIL) ---
        function renderThumbnails() {
            const container = document.getElementById('albumGrid');
            const selectedYear = document.getElementById('yearSelect').value;
            
            let filteredAlbums = albums;
            if (selectedYear !== 'all') {
                filteredAlbums = albums.filter(a => a.year == selectedYear);
            }

            container.innerHTML = '';
            
            if(filteredAlbums.length === 0) {
                container.innerHTML = `<p style="grid-column: 1/-1; text-align:center; font-weight:bold; color:#ff6b9e;">Năm này chưa có album nào cả. Bấm "Tạo Album Mới" ngay thôi! 🍀</p>`;
                return;
            }

            filteredAlbums.forEach(alb => {
                let itemsInAlbum = mediaItems.filter(m => m.albumId === alb.id);
                let coverHtml = `<div class="no-cover">📁</div>`;
                
                if (itemsInAlbum.length > 0) {
                    let firstItem = itemsInAlbum[0];
                    if (firstItem.type === 'video') {
                        coverHtml = `<video src="${firstItem.src}" muted preload="metadata"></video>`;
                    } else {
                        coverHtml = `<img src="${firstItem.src}" alt="cover">`;
                    }
                }

                container.innerHTML += `
                    <div class="album-thumb" onclick="openDetailModal('${alb.id}')">
                        <div class="album-cover">
                            ${coverHtml}
                            <div class="album-count">${itemsInAlbum.length} mục</div>
                        </div>
                        <div class="album-info">
                            <h3>${alb.name}</h3>
                            <span class="album-badge">${alb.category}</span>
                        </div>
                    </div>
                `;
            });
        }

        // --- QUẢN LÝ ALBUM (TẠO / SỬA) ---
        function openAlbumModal(id = null) {
            document.getElementById('albumModal').style.display = 'flex';
            if(id) {
                let alb = albums.find(a => a.id === id);
                document.getElementById('albumModalTitle').innerText = '✏️ Sửa Album';
                document.getElementById('modalAlbumId').value = alb.id;
                document.getElementById('modalAlbumName').value = alb.name;
                document.getElementById('modalAlbumYear').value = alb.year;
                document.getElementById('modalAlbumCat').value = alb.category;
            } else {
                document.getElementById('albumModalTitle').innerText = '✨ Tạo Album Mới';
                document.getElementById('modalAlbumId').value = '';
                document.getElementById('modalAlbumName').value = '';
                document.getElementById('modalAlbumYear').value = new Date().getFullYear();
                document.getElementById('modalAlbumCat').value = 'Sự Kiện 🎉';
            }
        }

        function closeAlbumModal() { document.getElementById('albumModal').style.display = 'none'; }

        function saveAlbum() {
            const id = document.getElementById('modalAlbumId').value;
            const name = document.getElementById('modalAlbumName').value.trim();
            const year = parseInt(document.getElementById('modalAlbumYear').value);
            const cat = document.getElementById('modalAlbumCat').value;

            if(!name || !year) return alert("Vui lòng nhập tên và năm Album!");

            if(id) {
                let alb = albums.find(a => a.id === id);
                alb.name = name; alb.year = year; alb.category = cat;
                // Nếu đang mở Modal lớn, cập nhật luôn text trên đó
                if(currentViewAlbumId === id) {
                    document.getElementById('detailTitle').innerText = alb.name;
                    document.getElementById('detailBadge').innerText = alb.category;
                    document.getElementById('detailYear').innerText = `📅 ${alb.year}`;
                }
            } else {
                albums.unshift({ id: 'alb_' + Math.random().toString(36).substr(2, 9), name, year, category: cat });
            }
            
            saveData();
            closeAlbumModal();
            renderYearsDropdown();
            renderThumbnails();
        }

        // --- XỬ LÝ POPUP LỚN (ALL-IN-ONE) ---
        function openDetailModal(albumId) {
            currentViewAlbumId = albumId;
            let alb = albums.find(a => a.id === albumId);
            
            // Cập nhật Header
            document.getElementById('detailTitle').innerText = alb.name;
            document.getElementById('detailBadge').innerText = alb.category;
            document.getElementById('detailYear').innerText = `📅 ${alb.year}`;
            document.getElementById('btnPlaySlideshow').onclick = () => window.location.href = `trinh-chieu.html?id=${albumId}`;
            
            renderDetailMediaGrid();
            document.getElementById('albumDetailModal').style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Khóa cuộn trang nền
        }

        function closeDetailModal() {
            document.getElementById('albumDetailModal').style.display = 'none';
            document.body.style.overflow = 'auto'; // Mở khóa cuộn
            currentViewAlbumId = null;
            renderThumbnails(); // Render lại thumbnail nhỡ ảnh bìa thay đổi
        }

        function editCurrentAlbum() { openAlbumModal(currentViewAlbumId); }

        function deleteCurrentAlbum() {
            let alb = albums.find(a => a.id === currentViewAlbumId);
            if(confirm(`Bạn có chắc muốn xóa vĩnh viễn album "${alb.name}" và toàn bộ kỷ niệm bên trong?`)) {
                albums = albums.filter(a => a.id !== currentViewAlbumId);
                mediaItems = mediaItems.filter(m => m.albumId !== currentViewAlbumId);
                saveData();
                closeDetailModal();
                renderYearsDropdown();
                renderThumbnails();
            }
        }

        // Render Lưới ảnh trong Modal Lớn
        function renderDetailMediaGrid() {
            const grid = document.getElementById('detailMediaGrid');
            let items = mediaItems.filter(m => m.albumId === currentViewAlbumId);
            
            if(items.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #999; font-weight:bold;">Chưa có kỷ niệm nào. Hãy tải lên ngay phía trên nhé!</p>`;
                return;
            }

            grid.innerHTML = items.map(item => {
                let contentTag = item.type === 'video' 
                    ? `<video src="${item.src}" controls></video>` 
                    : `<img src="${item.src}" alt="Kỷ niệm">`;
                
                return `
                    <div class="media-card">
                        <div class="media-container">${contentTag}</div>
                        <div class="media-body">
                            <div class="media-caption">${item.caption ? item.caption : '<span style="color:#ccc; font-style:italic;">Chưa có caption...</span>'}</div>
                            <div class="media-actions">
                                <button class="btn btn-secondary btn-small" onclick="openCaptionModal('${item.id}')">✍️</button>
                                <button class="btn-danger btn-small" style="border:none; cursor:pointer;" onclick="deleteMedia('${item.id}')">❌</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Xử lý Form Upload trong Modal Lớn
        document.getElementById('detailUploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if(!currentViewAlbumId) return;

            const fileInput = document.getElementById('detailFileInput');
            const urlInput = document.getElementById('detailMediaUrl').value.trim();
            const submitBtn = document.getElementById('btnUploadMedia');

            if(fileInput.files && fileInput.files.length > 0) {
                submitBtn.disabled = true; submitBtn.innerText = "⏳ Đang tải...";

                const files = Array.from(fileInput.files);
                const readFilesPromises = files.map(file => {
                    return new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            resolve({
                                id: 'med_' + Math.random().toString(36).substr(2, 9),
                                albumId: currentViewAlbumId,
                                src: e.target.result,
                                type: file.type.startsWith('video') ? 'video' : 'image',
                                caption: ""
                            });
                        };
                        reader.readAsDataURL(file);
                    });
                });

                const newItems = await Promise.all(readFilesPromises);
                mediaItems.push(...newItems); // Thêm vào cuối để giữ thứ tự upload
                
                saveData();
                renderDetailMediaGrid();
                this.reset();
                submitBtn.disabled = false; submitBtn.innerText = "🚀 Đăng Lên";

            } else if(urlInput) {
                let type = (urlInput.match(/\.(mp4|webm|ogg)$/i) || urlInput.includes('video')) ? 'video' : 'image';
                mediaItems.push({
                    id: 'med_' + Math.random().toString(36).substr(2, 9),
                    albumId: currentViewAlbumId,
                    src: urlInput,
                    type: type,
                    caption: ""
                });
                saveData();
                renderDetailMediaGrid();
                this.reset();
            } else {
                alert("Chọn file hoặc dán link trước nhé!");
            }
        });

        window.deleteMedia = function(id) {
            if(confirm("Xóa kỷ niệm này?")) {
                mediaItems = mediaItems.filter(m => m.id !== id);
                saveData(); 
                renderDetailMediaGrid(); // Update ngay lưới ảnh trong Modal
            }
        }

        // --- MODAL CAPTION ---
        window.openCaptionModal = function(id) {
            const item = mediaItems.find(m => m.id === id);
            document.getElementById('modalMediaId').value = id;
            document.getElementById('modalCaptionText').value = item.caption || "";
            document.getElementById('captionModal').style.display = 'flex';
        }
        function closeCaptionModal() { document.getElementById('captionModal').style.display = 'none'; }
        function saveCaption() {
            const id = document.getElementById('modalMediaId').value;
            const item = mediaItems.find(m => m.id === id);
            if(item) {
                item.caption = document.getElementById('modalCaptionText').value;
                saveData(); 
                renderDetailMediaGrid();
            }
            closeCaptionModal();
        }

        // Khởi chạy
        normalizeData();
        renderYearsDropdown();
        renderThumbnails();
    </script>
</body>
</html>
